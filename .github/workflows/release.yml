name: Release

# Releases are cut by pushing a tag:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# The tag is the trigger and the audit trail. Nothing is published unless the
# tag agrees with blackvoice/__init__.py and the test suite passes.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the v (e.g. 0.1.0). Builds artifacts but publishes nothing.'
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ------------------------------------------------------------------ #
  verify:
    name: Verify version and tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: The tag and the code must agree
        id: version
        run: |
          CODE=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', pathlib.Path('blackvoice/__init__.py').read_text()).group(1))")

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WANTED="${{ inputs.version }}"
          else
            WANTED="${GITHUB_REF_NAME#v}"
          fi

          echo "blackvoice/__init__.py : $CODE"
          echo "requested              : $WANTED"

          if [ "$CODE" != "$WANTED" ]; then
            echo "::error::Version mismatch. The tag says $WANTED but the code says $CODE."
            echo "::error::Update __version__ in blackvoice/__init__.py, commit, then re-tag."
            exit 1
          fi

          echo "version=$CODE" >> "$GITHUB_OUTPUT"

      - name: Qt runtime libraries
        run: |
          # PyQt6 links against these even under the offscreen platform; a bare
          # runner has none of them and the import fails with
          # "libEGL.so.1: cannot open shared object file".
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends             libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 > /dev/null

      - name: Install and test
        env:
          # The overlay tests need a Qt platform plugin but no display.
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --quiet --upgrade pip
          # ui is included so the overlay tests actually run here rather than
          # skipping silently - a test that never executes is not a test.
          pip install --quiet -e ".[dev,ui]"
          pytest -q

  # ------------------------------------------------------------------ #
  python-dist:
    name: Wheel and sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: |
          python -m pip install --quiet --upgrade pip build
          python -m build
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  # ------------------------------------------------------------------ #
  source-tarball:
    name: Source tarball
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build blackvoice-${{ needs.verify.outputs.version }}-source.tar.gz
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # A portable tarball for distributions we do not package natively -
          # Arch, openSUSE, Gentoo and anyone who would rather read install.sh.
          #
          # Named *-source.tar.gz, not plain ${VERSION}.tar.gz: the wheel-and-
          # sdist job's `python -m build` also produces a file named exactly
          # blackvoice-${VERSION}.tar.gz - the sdist, PyPI's own convention -
          # and the release job below collects every *.tar.gz it finds into
          # one flat directory by basename. Two jobs handing it the same name
          # means one silently overwrites the other, which is exactly what
          # happened the first time this ran: the sdist survived and this
          # tarball - the only one with install.sh in it - quietly did not
          # ship, so the "anything else" install instructions on the release
          # page pointed at a file with no install.sh inside it.
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="blackvoice-${VERSION}/" \
            -o "dist/blackvoice-${VERSION}-source.tar.gz" HEAD
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: dist/*.tar.gz

  # ------------------------------------------------------------------ #
  deb:
    name: Debian package
    needs: verify
    runs-on: ubuntu-latest
    # The bundled virtualenv is tied to the interpreter that built it, so the
    # package is built on the oldest distribution it claims to support.
    container: debian:12
    steps:
      - name: Build prerequisites
        run: |
          apt-get update -qq
          # python3-requests/numpy/cffi: not bundled into the package - they
          # are declared Depends: instead, on the assumption that any real
          # Debian install already has them. Installing them here too is what
          # makes that assumption true on the *build* container as well,
          # which build-package.sh's own verification step now relies on: it
          # actually imports vosk rather than just checking its directory
          # exists, and vosk imports requests - without this, that check was
          # failing for the wrong reason entirely, on a machine no end user's
          # install would ever resemble.
          apt-get install -y -qq --no-install-recommends \
            git python3 python3-venv python3-pip \
            ruby ruby-dev build-essential rpm \
            portaudio19-dev libasound2-dev \
            python3-requests python3-numpy python3-cffi > /dev/null
          gem install --no-document fpm > /dev/null

      - uses: actions/checkout@v4

      - name: Build the .deb
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chmod +x packaging/build-package.sh
          ./packaging/build-package.sh deb

      - name: Inspect what we produced
        run: |
          DEB=$(ls dist/*.deb)
          echo "### $DEB"
          dpkg-deb --info "$DEB"
          echo "--- contents (top level) ---"
          dpkg-deb --contents "$DEB" | awk '{print $6}' | cut -d/ -f1-3 | sort -u | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  # ------------------------------------------------------------------ #
  rpm:
    name: RPM package
    needs: verify
    runs-on: ubuntu-latest
    container: fedora:40
    steps:
      - name: Build prerequisites
        run: |
          # python3-requests/numpy/cffi: see the identical comment in the deb
          # job above - build-package.sh's verification step actually imports
          # vosk now, which needs requests, and this package's own --depends
          # further down already names these exact three for Fedora, so this
          # is the same assumption the .rpm itself already makes.
          dnf install -y -q \
            git python3 python3-pip \
            ruby ruby-devel gcc make redhat-rpm-config rpm-build \
            portaudio-devel alsa-lib-devel \
            python3-requests python3-numpy python3-cffi > /dev/null
          gem install --no-document fpm > /dev/null

      - uses: actions/checkout@v4

      - name: Build the .rpm
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chmod +x packaging/build-package.sh
          ./packaging/build-package.sh rpm

      - name: Inspect what we produced
        run: |
          RPM=$(ls dist/*.rpm)
          echo "### $RPM"
          rpm -qip "$RPM"
          echo "--- contents (top level) ---"
          rpm -qlp "$RPM" | cut -d/ -f1-3 | sort -u | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  # ------------------------------------------------------------------ #
  release:
    name: Publish the release
    needs: [verify, python-dist, source-tarball, deb, rpm]
    runs-on: ubuntu-latest
    # A manual run builds and checks everything but publishes nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum
        id: collect
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p release
          # -print0/read -d '' rather than -exec cp: this counts what was
          # matched against what actually landed, so two jobs handing the
          # same filename to different artifacts - a silent overwrite, one of
          # them just gone from the release - fails the build loudly instead
          # of shipping quietly wrong. See the source-tarball job for the
          # collision that motivated this.
          MATCHED=0
          while IFS= read -r -d '' f; do
            cp "$f" release/
            MATCHED=$((MATCHED + 1))
          done < <(find artifacts -type f \( -name '*.deb' -o -name '*.rpm' \
            -o -name '*.tar.gz' -o -name '*.whl' \) -print0)
          COLLECTED=$(find release -type f | wc -l)
          if [ "$MATCHED" -ne "$COLLECTED" ]; then
            echo "::error::$MATCHED artifact files matched but only $COLLECTED landed in release/ - two jobs produced the same filename and one silently overwrote the other. Matches below; give the losing one a distinct name." >&2
            find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.whl' \)
            exit 1
          fi
          cd release
          sha256sum * > SHA256SUMS
          echo "--- release contents ---"
          ls -lh
          echo
          cat SHA256SUMS

      - name: Write the release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Black Voice ${VERSION}

          An offline-first voice assistant for Linux, in English. Speech
          recognition runs on your own machine.

          ### Install

          **Debian, Ubuntu, Mint, Pop!_OS**
          \`\`\`bash
          sudo apt install ./blackvoice_${VERSION}-1_amd64.deb
          \`\`\`

          **Fedora, RHEL, openSUSE**
          \`\`\`bash
          sudo dnf install ./blackvoice-${VERSION}-1.x86_64.rpm
          \`\`\`

          **Anything else**
          \`\`\`bash
          tar xzf blackvoice-${VERSION}-source.tar.gz
          cd blackvoice-${VERSION}
          ./install.sh --system
          \`\`\`

          On its first run Black Voice downloads the offline speech models
          (~90 MB) into your home directory - they are per-user, so a package
          cannot install them for you.

          \`\`\`bash
          blackvoice doctor    # optional: check what is installed
          \`\`\`

          ### What is in the packages

          The \`.deb\` and \`.rpm\` run on your system Python and depend on the
          packages your distribution already provides. Only the four libraries
          no distribution ships - vosk, sounddevice, SpeechRecognition and
          pyttsx3 - are bundled, and none of them is tied to a Python version,
          so one build works everywhere.

          ### Verify your download

          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`

          ### Documentation

          https://github.com/RudraLabs-dev/blackvoice/wiki
          EOF
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Black Voice ${{ needs.verify.outputs.version }}" \
            --notes-file notes.md \
            release/*
          echo "Published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
