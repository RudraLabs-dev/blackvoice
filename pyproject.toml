[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackvoice"
# Single source of truth: blackvoice/__init__.py. The release workflow
# refuses to build when the git tag and this value disagree.
dynamic = ["version"]
description = "Black Voice — an offline-first English voice assistant for Linux. A Rudra Labs product."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rudra Labs" }]
maintainers = [{ name = "Gaurav Sharma" }]
keywords = ["voice-assistant", "linux", "vosk", "speech-recognition"]
classifiers = [
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Minimums are deliberately low. The distribution packages supply numpy,
# requests and psutil, so a tight floor here would exclude working systems -
# Ubuntu 22.04 ships numpy 1.21 - for APIs this project does not use. Only
# frombuffer/sqrt/mean are needed from numpy, and those have been stable for
# years.
dependencies = [
  "sounddevice>=0.4.0",
  "numpy>=1.17",
  "requests>=2.25",
  "psutil>=5.6",
]

[project.optional-dependencies]
offline = ["vosk>=0.3.45"]
online  = ["SpeechRecognition>=3.10"]
ui      = ["PyQt6>=6.6"]
tts     = ["pyttsx3>=2.90"]
all     = ["vosk>=0.3.45", "SpeechRecognition>=3.10", "PyQt6>=6.6", "pyttsx3>=2.90"]
dev     = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
blackvoice = "blackvoice.cli:main"
black-voice = "blackvoice.cli:main"

[project.urls]
Homepage = "https://github.com/RudraLabs-dev/blackvoice"

[tool.setuptools.dynamic]
version = { attr = "blackvoice.__version__" }

[tool.setuptools.packages.find]
include = ["blackvoice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
